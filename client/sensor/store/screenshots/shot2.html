<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:800px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
  body{background:#0f141a;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:34px;}
  .cap{text-align:center;max-width:900px}
  h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-.02em;color:#f2f4f7}
  p{margin:12px 0 0;font-size:18px;line-height:1.5;color:#9aa4b2}
  .accent{color:#ff5c1a}
  /* Cropped to the extension's own "What this extension sees" section. Real
     UI: the promise is made by the product, not by marketing copy over it. */
  .frame{width:820px;height:300px;border:1px solid #23282f;border-radius:10px;
    overflow:hidden;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.55)}
  iframe{width:820px;height:1100px;border:0;margin-top:-586px}
</style></head><body>
  <div class="cap">
    <h1>It sees <span class="accent">one</span> website, and not your mail</h1>
    <p>Only the webmail you choose: that it is open, and which message you
       opened. Never the message, never your password, never anywhere else.</p>
  </div>
  <div class="frame"><iframe src="options.html" scrolling="no"></iframe></div>
</body></html>
