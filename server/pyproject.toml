[project]
name = "envelock-server"
version = "0.1.0"
description = "Envelock — email fraud and account-takeover protection"
requires-python = ">=3.12,<3.15"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",       # EmailStr validation on signup

    # Storage
    "sqlalchemy>=2.0",
    "greenlet>=3.0",              # required by SQLAlchemy's async engine
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "clickhouse-connect>=0.8",

    # Queue / workers
    "arq>=0.26",

    # Channel 1 — mail
    "aioimaplib>=1.1",           # Tier 3 IMAP IDLE
    "imapclient>=3.0",           # Tier 3 polling
    "mail-parser>=4.1",
    "aiosmtpd>=1.4",             # Tier 4 forwarding ingest
    "msal>=1.31",                # Tier 1 Microsoft Graph
    "google-api-python-client>=2.150",
    "google-auth>=2.36",

    # Notifications
    "aiosmtplib>=3.0",           # L2 async SMTP delivery
    "dkimpy>=1.1",               # DKIM-sign outbound alert email (we must pass D5)

    # Channel 2 — identity
    "pywebpush>=2.0",            # L1 push, self-hosted VAPID
    "user-agents>=2.2",

    # Channel 3 — external
    "dnspython>=2.7",
    "tldextract>=5.1",           # Public Suffix List — trial ledger + domain normalisation
    "python-whois>=0.9",         # RDAP fallback only
    # >=50: PYSEC-2026-3552. This is the library sealing every stored mailbox
    # credential, so the floor is not advisory.
    "cryptography>=50.0",
    # Declared, not left transitive: IMAP certificate verification falls back to
    # it when the platform trust store is empty, and a host with neither cannot
    # authenticate any mail server.
    "certifi>=2024.7",

    # Detection
    "confusable-homoglyphs>=3.3",  # A4
    "rapidfuzz>=3.10",             # A3 Damerau-Levenshtein
    "yara-python>=4.5",            # B-cascade layer 1
    "oletools>=0.60",              # macro extraction
    "pdfminer.six>=20240706",
    # >=6.15: PYSEC-2026-3655 / -3656. pypdf parses PDF attachments taken
    # straight from incoming mail — attacker-controlled input by design, which
    # is precisely the threat this product exists to handle. Do not lower.
    "pypdf>=6.15",
    "python-docx>=1.1",            # A1 — extract bank details from .docx invoices
    "pyzbar>=0.1.9",               # B3 — decode QR codes ("quishing")
    "pytesseract>=0.3.13",         # A1 — OCR bank details from image attachments
    "pillow>=11.0",                # image decoding for OCR + QR
    "schwifty>=2024.11",           # IBAN validation — A1
    "python-stdnum>=1.20",         # SWIFT/BIC, sort codes — A1

    # Outbound HTTP. Runtime, not dev: 12 call sites import it lazily —
    # payments, the LLM providers, OAuth token exchange, webhook delivery, the
    # KMS providers, Safe Browsing, geo-IP and the CT watcher. It was previously
    # declared dev-only, so `pip install .` (what the Dockerfile runs) produced
    # an image where every one of those raised ImportError on first use.
    "httpx>=0.28",

    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envelock"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these files; reformatting them makes real edits harder to spot
# in review and gains nothing.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# One inline HTML template for the click-time link interstitial. Rewrapping it
# to satisfy a Python line-length rule would change the markup it emits.
"src/envelock/api/redirect.py" = ["E501"]

[tool.mypy]
# `strict = true` was aspirational: it was never run in CI and produced 532
# errors across 75 of 118 files, so it described a standard the code did not meet
# and no change was ever measured against. A gate that is not enforced is not a
# gate.
#
# This is the strongest configuration the codebase passes TODAY, and it now runs
# in CI. The commented settings below are the ratchet: turn one on, fix what it
# finds, commit. That is a standard that improves; `strict = true` unenforced is
# one that never does.
python_version = "3.12"
plugins = ["pydantic.mypy"]

# The checks that catch real bugs rather than missing annotations.
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# Third-party packages without type information. Listing them explicitly (rather
# than a blanket `ignore_missing_imports = true`) means adding a new untyped
# dependency is a deliberate line in this file, not a silent hole.
[[tool.mypy.overrides]]
module = [
    "aioimaplib.*", "imapclient.*", "mailparser.*", "aiosmtpd.*", "msal.*",
    "googleapiclient.*", "google.*", "pywebpush.*", "user_agents.*",
    "whois.*", "yara.*", "oletools.*", "pdfminer.*", "pyzbar.*",
    "pytesseract.*", "PIL.*", "schwifty.*", "stdnum.*", "docx.*",
    "confusable_homoglyphs.*", "dkim.*", "clickhouse_connect.*", "arq.*",
]
ignore_missing_imports = true

# The ratchet. Uncomment one at a time.
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
# disallow_untyped_calls = true
# disallow_any_generics = true
# strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/ mixes bare (`from conftest import ...`) and package-qualified
# (`from tests.test_x import ...`) imports; both roots must be importable.
pythonpath = [".", "tests"]
