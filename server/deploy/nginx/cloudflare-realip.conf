# Restore the real visitor IP when Cloudflare is proxying (orange cloud).
#
# Include this inside each server block:  include snippets/cloudflare-realip.conf;
#
# Why this is load-bearing, not cosmetic:
#
# Envelock rate-limits by client IP. Without this, nginx's $remote_addr is a
# Cloudflare edge address, and the X-Forwarded-For it passes on begins with
# whatever the *client* sent — because Cloudflare APPENDS the real client IP to
# any existing XFF header rather than replacing it. So anyone could send
#
#     X-Forwarded-For: 1.2.3.4
#
# and land in a rate-limit bucket of their choosing: a fresh one for every
# request, which is the same as having no sign-in or password-reset limits at
# all.
#
# `real_ip_header CF-Connecting-IP` fixes that, because CF-Connecting-IP is set
# by Cloudflare itself on every request and cannot be forged from outside — but
# only for connections arriving from the Cloudflare ranges listed below, which is
# what `set_real_ip_from` enforces. A request that reaches the origin directly
# is not trusted to set it.
#
# Pair this with `proxy_set_header X-Forwarded-For $remote_addr;` in the vhost
# (note: $remote_addr, NOT $proxy_add_x_forwarded_for) so exactly one value
# reaches the app and none of it is client-controlled.
#
# If you ever stop using Cloudflare, this degrades safely: no CF-Connecting-IP
# header arrives, so $remote_addr stays the true peer.
#
# Ranges from https://www.cloudflare.com/ips/ — re-check yearly; Cloudflare adds
# ranges occasionally, and a missing one means those visitors all share the
# edge's IP.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
