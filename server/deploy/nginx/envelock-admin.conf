# ─────────────────────────────────────────────────────────────────────────────
# WARNING: this file is HTTP-only. certbot EDITS THE INSTALLED COPY in
# /etc/nginx/sites-available/ to add the `listen 443` + ssl_certificate blocks.
#
# So copying this file over a live, certbot-managed one SILENTLY REMOVES HTTPS —
# nginx keeps serving on 80, port 443 stops answering, and the site looks down
# while every check of nginx itself passes. If you re-copy these configs for any
# reason, put TLS back afterwards:
#
#     sudo certbot install --cert-name envelock.org
#
# That reuses the existing certificate and re-adds the 443 blocks. It needs no
# DNS validation, so it works even with Cloudflare's proxy switched on.
# ─────────────────────────────────────────────────────────────────────────────
# admin.envelock.org — the operator console (admin/dist).
#
# Unlike the customer client, the admin app has NO configurable API base: it
# calls `/api/...` relative to its own origin. The proxy block below is therefore
# load-bearing — without it the console renders and every request 404s.
server {
    listen 80;
    server_name admin.envelock.org;
    root /home/ubuntu/apps/admin/dist;
    index index.html;

    include snippets/cloudflare-realip.conf;

    # In a snippet included here AND in every location that adds a header of
    # its own — see headers-admin.conf. Before this the console's HTML was served
    # without any of them.
    include snippets/headers-admin.conf;

    location /api/ {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: the latter begins with
        # whatever the client sent, which lets anyone pick their own
        # rate-limit bucket. See snippets/cloudflare-realip.conf.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        include snippets/headers-admin.conf;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        include snippets/headers-admin.conf;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
