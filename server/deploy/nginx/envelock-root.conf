# ─────────────────────────────────────────────────────────────────────────────
# WARNING: this file is HTTP-only. certbot EDITS THE INSTALLED COPY in
# /etc/nginx/sites-available/ to add the `listen 443` + ssl_certificate blocks.
#
# So copying this file over a live, certbot-managed one SILENTLY REMOVES HTTPS —
# nginx keeps serving on 80, port 443 stops answering, and the site looks down
# while every check of nginx itself passes. If you re-copy these configs for any
# reason, put TLS back afterwards:
#
#     sudo certbot install --cert-name envelock.org
#
# That reuses the existing certificate and re-adds the 443 blocks. It needs no
# DNS validation, so it works even with Cloudflare's proxy switched on.
# ─────────────────────────────────────────────────────────────────────────────
# envelock.org and www.envelock.org — the apex and its www alias.
#
# These were the last two names without a certificate, which showed up as a
# Cloudflare 526 ("invalid SSL certificate"): the names resolved, reached nginx,
# and nginx answered with a certificate issued for app/api/admin instead. On
# Cloudflare's Full (strict) mode that is correctly refused.
#
# There is no marketing site yet, so both redirect to the dashboard. Replace the
# `return 301` with a root/index when there is something to serve here.
server {
    listen 80;
    server_name envelock.org www.envelock.org;

    # Kept ahead of the redirect so certbot's renewal challenge is answered
    # rather than bounced to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Microsoft publisher-domain verification. Must be served from the APEX at
    # this exact path: the verifier fetches it directly and does NOT follow the
    # redirect below, so without this it sees a 301 and fails the domain. The
    # applicationId is a public client id, not a secret — Microsoft requires it
    # to be world-readable, which is the whole mechanism.
    location = /.well-known/microsoft-identity-association.json {
        root /home/ubuntu/apps/client/dist;
        default_type application/json;
        try_files $uri =404;
    }

    # The legal pages are served HERE, at the apex, rather than bounced to
    # app. — these are the URLs given to Google and Microsoft during OAuth
    # verification and to app-store reviewers, and a policy URL that 301s to a
    # different hostname is the sort of thing a reviewer queries. They are the
    # same SPA build; only the chrome differs, which is decided in the app.
    location ~ ^/(tos|terms|privacy|dpa|subprocessors)$ {
        root /home/ubuntu/apps/client/dist;
        try_files $uri /index.html;
    }

    # Hashed asset filenames, needed by the pages above.
    location /assets/ {
        root /home/ubuntu/apps/client/dist;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / { return 301 https://app.envelock.org$request_uri; }
}
