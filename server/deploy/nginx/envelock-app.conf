# ─────────────────────────────────────────────────────────────────────────────
# WARNING: this file is HTTP-only. certbot EDITS THE INSTALLED COPY in
# /etc/nginx/sites-available/ to add the `listen 443` + ssl_certificate blocks.
#
# So copying this file over a live, certbot-managed one SILENTLY REMOVES HTTPS —
# nginx keeps serving on 80, port 443 stops answering, and the site looks down
# while every check of nginx itself passes. If you re-copy these configs for any
# reason, put TLS back afterwards:
#
#     sudo certbot install --cert-name envelock.org
#
# That reuses the existing certificate and re-adds the 443 blocks. It needs no
# DNS validation, so it works even with Cloudflare's proxy switched on.
# ─────────────────────────────────────────────────────────────────────────────
# app.envelock.org — the customer dashboard (client/dist).
server {
    listen 80;
    server_name app.envelock.org;
    root /home/ubuntu/apps/client/dist;
    index index.html;

    include snippets/cloudflare-realip.conf;

    # Security headers live in a snippet included here AND in every location
    # that adds a header of its own — see headers-app.conf for why that
    # repetition is load-bearing. `client/vercel.json` carries the same policy
    # for a Vercel deployment; on nginx that file is inert.
    include snippets/headers-app.conf;

    # Hashed filenames, so they can be cached forever…
    location /assets/ {
        expires 1y;
        include snippets/headers-app.conf;
        add_header Cache-Control "public, immutable";
    }

    # …but index.html must never be, or a deploy leaves people on the old bundle
    # pointing at asset URLs that no longer exist.
    location = /index.html {
        include snippets/headers-app.conf;
        add_header Cache-Control "no-cache";
    }

    # The Outlook sensor add-in's task pane. Outlook frames it and it must load
    # Microsoft's office.js, so it gets its own policy (headers-addin.conf) —
    # the dashboard's stays exactly as strict as it was. Never falls back to
    # index.html: a missing add-in file is a 404, not the dashboard.
    location /addins/outlook/ {
        include snippets/headers-addin.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Sensor packages (Thunderbird .xpi, browser .zip) linked from the dashboard.
    location /downloads/ {
        include snippets/headers-app.conf;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;   # client-side routing
    }
}
