# Security headers for admin.envelock.org — the staff console.
#
# Same inheritance trap as headers-app.conf, and worse here: this console sees
# every tenant, and its HTML was being served without CSP, X-Frame-Options, HSTS
# or noindex because `location = /index.html` sets a Cache-Control of its own.
# Included at server level and in every location that adds a header.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# An operator console has no business in a search index.
add_header X-Robots-Tag "noindex, nofollow" always;
