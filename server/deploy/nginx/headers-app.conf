# Security headers for app.envelock.org — the customer dashboard.
#
# Installed to /etc/nginx/snippets/ and included in the server block AND in
# every location that sets an add_header of its own. That repetition is the
# whole point of this file:
#
#   nginx only inherits add_header from the enclosing level when the current
#   level has none of its own. `location = /index.html` sets Cache-Control, and
#   every dashboard route reaches index.html through `try_files` — so for as
#   long as these headers lived only at server level, the dashboard's HTML was
#   served with no CSP, no X-Frame-Options and no HSTS. The clickjacking
#   protection this config declared never applied to the page it protects.
#
# Include it, don't copy it: a copy is what drifts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.envelock.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
