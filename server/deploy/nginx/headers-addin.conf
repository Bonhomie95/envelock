# Security headers for /addins/outlook/ on app.envelock.org — the Outlook
# sensor add-in's task pane.
#
# It cannot use the dashboard's policy, and must not weaken it either:
#
# - Outlook on the web and the new Outlook load an add-in inside an iframe, so
#   `frame-ancestors 'none'` and `X-Frame-Options: DENY` would stop it loading
#   at all. Framing is allowed for Outlook's own origins and nothing else.
#   (Classic Outlook for Windows and Outlook for Mac render add-ins as a
#   top-level web view, where frame-ancestors does not apply.)
# - Microsoft requires add-ins to load office.js from its own CDN.
#
# Everything else stays as strict as the dashboard. No X-Frame-Options here on
# purpose: it cannot express an allow-list, and CSP frame-ancestors supersedes
# it in every browser Outlook runs on.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.envelock.org https://appsforoffice.microsoft.com; frame-ancestors https://outlook.office.com https://outlook.office365.com https://outlook.live.com https://outlook.cloud.microsoft https://*.officeapps.live.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
