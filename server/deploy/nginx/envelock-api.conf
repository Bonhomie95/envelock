# ─────────────────────────────────────────────────────────────────────────────
# WARNING: this file is HTTP-only. certbot EDITS THE INSTALLED COPY in
# /etc/nginx/sites-available/ to add the `listen 443` + ssl_certificate blocks.
#
# So copying this file over a live, certbot-managed one SILENTLY REMOVES HTTPS —
# nginx keeps serving on 80, port 443 stops answering, and the site looks down
# while every check of nginx itself passes. If you re-copy these configs for any
# reason, put TLS back afterwards:
#
#     sudo certbot install --cert-name envelock.org
#
# That reuses the existing certificate and re-adds the 443 blocks. It needs no
# DNS validation, so it works even with Cloudflare's proxy switched on.
# ─────────────────────────────────────────────────────────────────────────────
# api.envelock.org — the API itself.
#
# The application sets its own security headers (see security/middleware.py), so
# this vhost deliberately adds none: duplicating them here would mean two places
# to keep in sync, and nginx's `add_header` silently drops the app's on some
# response paths.
server {
    listen 80;
    server_name api.envelock.org;

    # An email can carry a large attachment; the app enforces its own 25 MB
    # ceiling, so let the request reach it rather than failing at the proxy with
    # an nginx error page the client cannot parse.
    client_max_body_size 30m;

    include snippets/cloudflare-realip.conf;

    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: the latter begins with
        # whatever the client sent, which lets anyone pick their own
        # rate-limit bucket. See snippets/cloudflare-realip.conf.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Connecting a mailbox walks a ladder of candidate IMAP servers, each
        # with its own connect budget. The default 60s read timeout cuts that off
        # mid-probe and shows the customer a gateway error instead of the real
        # reason their server did not answer.
        proxy_read_timeout 120s;
    }
}
